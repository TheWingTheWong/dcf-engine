[project]
name = "dcf-engine"
version = "0.1.0"
description = "Discounted cash flow valuation engine that writes analyst-grade Excel models with live formulas."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ansorjon Juraev" }]
requires-python = ">=3.10"
keywords = ["dcf", "valuation", "finance", "excel", "openpyxl", "wacc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = [
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.scripts]
dcf = "dcf_engine.cli:main"

[dependency-groups]
dev = [
    "pycel>=1.0b30",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcf_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
